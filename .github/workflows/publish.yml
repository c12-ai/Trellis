name: Release

# C12 fork release: a `v*` tag that matches packages/cli/package.json builds
# and tests the workspace, packs the CLI once, publishes that tarball to npm
# as `c12-trellis`, and attaches the same tarball plus its sha256 to the
# GitHub Release (pinned by BIC's .tools/trellis.lock). The CLI depends on the
# upstream `@mindfoldhq/trellis-core` release; the fork does not publish core.
# Reruns are idempotent: an npm version that already exists is skipped,
# and the Release then carries the tarball npm serves, replaced in place. See docs/c12-fork.md.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Same image as ci.yml, so the release runs the tests CI already passed.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # npm provenance attestation.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Check tag matches the CLI version
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/cli version $version"
            exit 1
          fi
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (core + cli)
        run: pnpm typecheck

      - name: Lint (core + cli)
        run: pnpm lint

      # Build before test: integration tests spawn the real CLI via
      # bin/trellis.js, which imports dist/ and needs build output to exist.
      - name: Build (core then cli)
        run: pnpm build

      - name: Test (core + cli)
        run: pnpm test

      - name: Pack the CLI
        id: pack
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          # `pnpm pack` does not run prepublishOnly, which is where upstream
          # copies these in; the AGPL license must ship with the package.
          cp README.md LICENSE packages/cli/
          (cd packages/cli && pnpm pack --pack-destination "$out")
          tgz=$(ls "$out"/c12-trellis-*.tgz)
          tar -xOzf "$tgz" package/LICENSE > /dev/null
          # The packed manifest must pin an exact core version that exists on
          # npm, and the workspace core we tested must be that release's source:
          # npm users get the published core, not packages/core.
          core=$(tar -xOzf "$tgz" package/package.json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).dependencies['@mindfoldhq/trellis-core'])")
          echo "Packed CLI depends on @mindfoldhq/trellis-core@$core"
          npm view "@mindfoldhq/trellis-core@$core" version > /dev/null
          if ! git diff --quiet "v$core" HEAD -- packages/core; then
            echo "::error::packages/core differs from upstream v$core; the published core would not match what was tested"
            exit 1
          fi
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          set -euo pipefail
          if npm view "c12-trellis@$VERSION" version > /dev/null 2>&1; then
            # A rerun after a partial failure: attach exactly what npm serves,
            # not a fresh pack whose sha256 would differ.
            echo "c12-trellis@$VERSION is already on npm; skipping publish."
            published="$RUNNER_TEMP/npm"
            mkdir -p "$published"
            (cd "$published" && npm pack "c12-trellis@$VERSION" > /dev/null)
            TGZ=$(ls "$published"/c12-trellis-*.tgz)
          else
            npm publish "$TGZ" --access public --provenance --tag "$NPM_TAG"
            # A new version can take minutes to appear ("Your package is being
            # processed"); a first publish may also be staged for approval.
            for attempt in $(seq 1 40); do
              [ "$(npm view "c12-trellis@$VERSION" version 2> /dev/null)" = "$VERSION" ] && break
              if [ "$attempt" = 40 ]; then
                echo "::error::c12-trellis@$VERSION is not visible on npm after 20 minutes. If npm staged it, approve it under Staged Packages on npmjs.com, then rerun this job."
                exit 1
              fi
              sleep 30
            done
          fi
          (cd "$(dirname "$TGZ")" && sha256sum "$(basename "$TGZ")" > "$(basename "$TGZ").sha256")
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TGZ: ${{ steps.npm.outputs.tgz }}
        run: |
          set -euo pipefail
          notes=$(node -e "process.stdout.write(require('./packages/cli/src/migrations/manifests/' + process.env.VERSION + '.json').changelog)")
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$TGZ" "$TGZ.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TGZ" "$TGZ.sha256" \
              --title "$GITHUB_REF_NAME" --notes "$notes" --verify-tag $prerelease
          fi
